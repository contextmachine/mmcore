name: poetry-build

on:
  push:
    branches: [ "master","dev", "tiny", "0.53.0"]
  pull_request:
    branches: [ "tiny" ]


jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ "ubuntu-latest", "macos-latest", "windows-latest" ]
        python-version: [ "3.9", "3.10", "3.11", "3.12", "3.13" ]
        exclude:
          - os: windows-latest
            python-version: "3.13"

    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.os }}


    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
        id: extract_branch

      - name: Set up python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}



      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry"
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true
      - name: Load cached venv
        id: cached-pip-wheels
        uses: actions/cache@v3
        with:
          path: ~/.cache
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ steps.extract_branch.outputs.branch }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Poetry build
        run: poetry build

      # Gates run once (ubuntu / one Python), after `poetry build` so the
      # freshly compiled extensions are already copied into the source tree
      # by build.py. `python -m pytest` from the repo root is required:
      # there is no conftest.py and test fixtures are CWD-relative.
      - name: Import health (subset of benign optional-dep leaves)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: poetry run python tools/check_imports.py

      - name: Layering (no upward import edges)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: poetry run python tools/check_layering.py

      - name: Test suite (without the single slow case)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: poetry run python -m pytest tests -q -m "not slow"

      - name: Artifact name
        id: artifactname
        run: |
          cd dist
          echo "wheelfile=$(ls *.whl| head -1)" >> $GITHUB_OUTPUT

      - name: Debug artifact name
        run: |
          echo "Artifact name: ${{  steps.artifactname.outputs.wheelfile}}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4.3.1
        with:
          path: dist
          name: ${{  steps.artifactname.outputs.wheelfile }}
          overwrite: true
  upload_pypi:
    needs: [ build ]
    if: ${{ github.ref == 'refs/heads/tiny' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mmcore/
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mmcore-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # auth is OIDC trusted publishing (environment: pypi); no token.
          # skip-existing: pushes that don't bump the version must not fail
          # the pipeline on the duplicate upload.
          skip-existing: true

  upload_test_pypi:
    needs: [ build ]
    if: ${{ github.ref == 'refs/heads/test' }}
    runs-on: ubuntu-latest
    environment:
      name: test-pypi
      url: https://test.pypi.org/project/mmcore/
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mmcore-*
          path: dist
          merge-multiple: true

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          user: __token__
          password: ${{ secrets.TEST_PYPI_TOKEN }}
